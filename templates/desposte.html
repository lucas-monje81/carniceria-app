<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desposte - Carne Vacuna</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background-color: #1a1d20; color: white; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 10px 15px; display: block; border-radius: 5px; margin-bottom: 5px; }
        .sidebar a:hover, .sidebar a.active { color: white; background-color: #dc3545; }
        .card { border: none; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075); }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Menú Lateral -->
            <nav class="col-md-2 d-none d-md-block sidebar p-3">
                <h4 class="text-white mb-4"><i class="fa-solid fa-drumstick-bite"></i> Carnicería App</h4>
                <ul class="nav flex-column">
                    <li class="nav-item mb-1 text-muted small px-3"><strong>CARNE VACUNA</strong></li>
                    <li class="nav-item ms-2"><a href="/" class="nav-link"><i class="fa-solid fa-dollar-sign me-2"></i> Precios</a></li>
                    <li class="nav-item ms-2"><a href="/desposte" class="nav-link active"><i class="fa-solid fa-scale-balanced me-2"></i> Desposte</a></li>
                    
                    <li class="nav-item mt-3 mb-1 text-muted small px-3"><strong>CARNE CERDO</strong></li>
                    <li class="nav-item ms-2"><a href="/cerdo" class="nav-link"><i class="fa-solid fa-dollar-sign me-2"></i> Precios</a></li>
                    <li class="nav-item ms-2"><a href="/cerdo/desposte" class="nav-link"><i class="fa-solid fa-scale-balanced me-2"></i> Desposte</a></li>

                    <li class="nav-item mt-3 mb-1 text-muted small px-3"><strong>GENERAL</strong></li>
                    <li class="nav-item"><a href="/empresa" class="nav-link"><i class="fa-solid fa-building me-2"></i> Empresa</a></li>
                    <li class="nav-item"><a href="/admin/licencias" class="nav-link {% if not es_admin %}d-none{% endif %}"><i class="fa-solid fa-key me-2"></i> Licencias (Admin)</a></li>
                </ul>
                <div class="mt-auto pt-5">
                    <a href="/logout" class="btn btn-danger w-100"><i class="fa-solid fa-right-from-bracket me-2"></i> Cerrar Sesión</a>
                </div>
            </nav>

            <!-- Contenido Principal -->
            <main class="col-md-10 ms-sm-auto px-md-4 py-4">
                <h2 class="mb-4">Desposte y Estructura Base - Carne Vacuna</h2>
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Control de Kilos y Merma</h5>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Total Kilos Cortes</label>
                                <input type="text" id="totalKilosCortes" class="form-control" readonly>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Kilos Media Res</label>
                                <input type="number" id="kilosMediaRes" class="form-control" value="92" oninput="calcularDesposte()">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Merma</label>
                                <input type="text" id="mermaKilos" class="form-control" readonly>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Cortes Registrados</h5>
                        <div class="table-responsive">
                            <table class="table table-striped align-middle" id="tablaDesposte">
                                <thead>
                                    <tr>
                                        <th>Corte</th>
                                        <th>Kilos</th>
                                        <th>Estructura (%)</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                        <button class="btn btn-success mt-3" onclick="guardarDesposte()"><i class="fa-solid fa-floppy-disk me-2"></i> Guardar Cambios</button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        let cortesData = [];
        async function cargarDatos() {
            const res = await fetch('/api/data?tipo=vacuna');
            const data = await res.json();
            if (data.params) {
                document.getElementById('kilosMediaRes').value = data.params.kilos_media_res || 92;
            }
            cortesData = data.cortes || [];
            calcularDesposte();
        }

        function calcularDesposte() {
            const kilosMediaRes = parseFloat(document.getElementById('kilosMediaRes').value) || 1;
            let totalKilos = 0;
            cortesData.forEach(c => totalKilos += parseFloat(c.kilos) || 0);
            const mermaKg = kilosMediaRes - totalKilos;
            const mermaPorc = kilosMediaRes > 0 ? (mermaKg / kilosMediaRes) * 100 : 0;

            document.getElementById('totalKilosCortes').value = `${totalKilos.toFixed(3)} kg`;
            document.getElementById('mermaKilos').value = `${mermaKg.toFixed(3)} kg (${mermaPorc.toFixed(2)}%)`;

            const tbody = document.querySelector('#tablaDesposte tbody');
            tbody.innerHTML = '';
            cortesData.forEach((corte, index) => {
                const estructura = kilosMediaRes > 0 ? (corte.kilos / kilosMediaRes) * 100 : 0;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${corte.nombre}</strong></td>
                    <td><input type="number" step="0.001" class="form-control form-control-sm" value="${corte.kilos}" oninput="actualizarKilos(${index}, this.value)"></td>
                    <td>${estructura.toFixed(2)}%</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function actualizarKilos(index, val) {
            cortesData[index].kilos = parseFloat(val) || 0;
            calcularDesposte();
        }

        async function guardarDesposte() {
            const params = { kilosMediaRes: document.getElementById('kilosMediaRes').value };
            await fetch('/api/save?tipo=vacuna', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ params, cortes: cortesData })
            });
            alert('¡Desposte guardado con éxito!');
        }
        cargarDatos();
    </script>
</body>
</html>
